name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fetch linux assets from upstream
        run: |
          git clone --depth 1 https://github.com/mubai0122/baicodex.git /tmp/up
          mkdir -p app/src/main/assets/linux
          cp -a /tmp/up/app/src/main/assets/linux/. app/src/main/assets/linux/
          du -sh app/src/main/assets/linux

      - name: Build debug APK
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: baicodex-debug
          path: app/build/outputs/apk/debug/*.apk