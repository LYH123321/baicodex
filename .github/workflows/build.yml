name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fetch linux assets from upstream
        run: |
          git clone --depth 1 https://github.com/mubai0122/baicodex.git /tmp/up
          mkdir -p app/src/main/assets/linux
          cp -a /tmp/up/app/src/main/assets/linux/. app/src/main/assets/linux/
          du -sh app/src/main/assets/linux
      - name: Setup QEMU for arm64
        uses: docker/setup-qemu-action@v3
      - name: Build linkfix.so (guest glibc, arm64)
        run: |
          # 关键：这个 .so 要被 guest 里的 glibc 加载，必须用同一套 glibc 编译。
          # 用 NDK/bionic 编出来的 ABI 不符，preload 会让 guest 里所有命令崩掉。
          docker run --platform linux/arm64 --name lf -v "$PWD/app/src/main/cpp/linkfix:/src:ro" ubuntu:24.04 bash -ec '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends gcc libc6-dev >/dev/null
            gcc -shared -fPIC -O2 -Wall -Wextra -o /src/linkfix.so /src/linkfix.c -ldl
          '
          ls -la app/src/main/cpp/linkfix/linkfix.so
          mkdir -p app/src/main/assets/linux
          cp app/src/main/cpp/linkfix/linkfix.so app/src/main/assets/linux/linkfix.so
          ls -la app/src/main/assets/linux/
      - name: Build full rootfs (ubuntu 24.04 arm64 + all toolchains preinstalled)
        run: |
          docker run --platform linux/arm64 --name rf ubuntu:24.04 bash -ec '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends nodejs npm python3 python3-pip python3-venv openssh-client openjdk-17-jdk-headless rustc cargo golang-go ca-certificates
            rm -rf /var/cache/apt/archives/* /var/lib/apt/lists/* /tmp/* /var/tmp/*
          '
          mkdir -p /tmp/rf
          docker export rf | gzip -6 > /tmp/rootfs.tgz
          ls -la /tmp/rootfs.tgz
      - name: Upload full rootfs
        uses: actions/upload-artifact@v4
        with:
          name: baicodex-rootfs
          path: /tmp/rootfs.tgz

      - name: Fetch quickjs sources
        run: |
          curl -sL -o /tmp/qjs.tar.gz https://github.com/quickjs-ng/quickjs/archive/5beca15a783c7be6b2a29a2223b49d0733ba0ece.tar.gz
          mkdir -p app/src/main/cpp/_third_party/quickjs
          tar -xzf /tmp/qjs.tar.gz -C /tmp
          rm -rf /tmp/quickjs-5beca15a783c7be6b2a29a2223b49d0733ba0ece/tests /tmp/quickjs-5beca15a783c7be6b2a29a2223b49d0733ba0ece/examples
          cp -r /tmp/quickjs-5beca15a783c7be6b2a29a2223b49d0733ba0ece/. app/src/main/cpp/_third_party/quickjs/
          ls app/src/main/cpp/_third_party/quickjs | head -20
      - name: Fetch prebuilt OpenSSL (KDAB android_openssl)
        run: |
          curl -sL -o /tmp/oss.tar.gz https://github.com/KDAB/android_openssl/archive/refs/heads/master.tar.gz
          tar -xzf /tmp/oss.tar.gz -C /tmp
          mkdir -p app/src/main/cpp/_third_party/android_openssl-master
          cp -r /tmp/android_openssl-master/ssl_3 app/src/main/cpp/_third_party/android_openssl-master/
          ls app/src/main/cpp/_third_party/android_openssl-master/ssl_3/arm64-v8a

      - name: Build debug APK
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: baicodex-debug
          path: app/build/outputs/apk/debug/*.apk